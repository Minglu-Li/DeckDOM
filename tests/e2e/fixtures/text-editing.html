<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>文字编辑验收</title>
  <style>
    body { margin: 40px; font-family: Arial, sans-serif; }
    .shared-copy { width: 180px; padding: 8px; }
    #inline-copy { font-size: 20px; }
  </style>
</head>
<body>
  <main>
    <p id="plain-copy" class="shared-copy">普通文字</p>
    <p id="inline-copy" class="shared-copy">欢迎 <strong>重要客户</strong> 使用 <code>HTML</code> 编辑器</p>
    <p id="untouched-copy" class="shared-copy">未选中的同类文字</p>
  </main>
</body>
</html>
